# ---------------------------------------------------------------
# Project Penguin - Unity EditMode / PlayMode テスト
#
# Unity のテスト実行には Editor のライセンス認証が必要なため、
# 同一リポジトリのPR、mainへのpush、手動起動で実行する。
# 認証情報が未登録のうちは自動でスキップされ、CI を赤くしない。
#
# 有効化の手順:
#   1. https://game.ci/docs/github/activation の手順で .ulf を取得する
#   2. リポジトリの Settings > Secrets に以下を登録する
#        UNITY_LICENSE  … .ulf ファイルの中身をそのまま貼る
#        UNITY_EMAIL    … Unity ID のメールアドレス
#        UNITY_PASSWORD … Unity ID のパスワード
#
# 初回は Library/ のキャッシュが無いため 20〜30 分かかる。
# ---------------------------------------------------------------
name: Unity Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: unity-tests-${{ github.ref }}
  cancel-in-progress: true

# 既定は権限なし。必要なジョブだけに付ける (#56)。
permissions: {}

jobs:
  probe:
    name: ライセンス設定の確認
    runs-on: ubuntu-latest
    # シークレットの有無を見るだけなので GITHUB_TOKEN の権限は要らない。
    permissions: {}
    outputs:
      licensed: ${{ steps.check.outputs.licensed }}
    steps:
      - id: check
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -n "$UNITY_LICENSE" ]; then
            echo "licensed=true" >> "$GITHUB_OUTPUT"
          else
            echo "licensed=false" >> "$GITHUB_OUTPUT"
            echo "UNITY_LICENSE が未登録のためテストをスキップします。"
          fi

  test:
    name: ${{ matrix.testMode }}
    needs: probe
    if: needs.probe.outputs.licensed == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    # checkout に contents: read、unity-test-runner がテスト結果のチェックを作るのに checks: write が要る。
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        testMode: [editmode, playmode]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      # Library/ はビルドのたびに作り直すと数十分かかるためキャッシュする。
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Library
          key: Library-${{ matrix.testMode }}-${{ hashFiles('Packages/packages-lock.json') }}
          restore-keys: |
            Library-${{ matrix.testMode }}-
            Library-

      - uses: game-ci/unity-test-runner@32e57712352b500e17974b245a6dce9e11a73213 # v4.4.0
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.6.0f1
          testMode: ${{ matrix.testMode }}
          artifactsPath: ${{ matrix.testMode }}-artifacts
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: ${{ matrix.testMode }} テスト結果

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ${{ matrix.testMode }}-results
          path: ${{ steps.tests.outputs.artifactsPath }}
